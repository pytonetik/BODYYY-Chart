<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BodyChart</title>
  <style>
    :root {
      --bg: #0d0f12; --panel: #171b21; --line: #2a313b; --text: #e8e6df;
      --muted: #8b93a0; --accent: #c9a96e; --danger: #e24b4b; --figure: #e6e4dc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }
    header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { font-family: Georgia, "Times New Roman", serif; font-size: 20px; color: #f3ead6; margin-right: 8px; }
    .brand span { font-size: 11px; color: var(--muted); font-family: system-ui; margin-left: 8px; letter-spacing: .04em; }
    header input, header button, .palette button, .tools button, .hud button {
      background: #101318; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit;
    }
    header input { width: 140px; } header input.wide { width: 190px; }
    header button, .tools button { cursor: pointer; }
    header button.primary { border-color: var(--accent); color: #f3ead6; }
    .grow { flex: 1; }
    main { flex: 1; display: flex; min-height: 0; }
    .palette { width: 168px; background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
    .palette h2, .tools h2 { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin: 4px 4px 6px; }
    .palette button { display: flex; align-items: center; gap: 8px; text-align: left; width: 100%; }
    .palette button.active { border-color: var(--accent); background: #211d14; }
    .swatch { width: 28px; height: 28px; flex: 0 0 28px; }
    .stage-wrap { flex: 1; position: relative; overflow: hidden; background: #0b0d10; touch-action: none; }
    #stage { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .stage-wrap.pan #stage { cursor: grab; } .stage-wrap.panning #stage { cursor: grabbing; }
    .hud { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
    .hud button { min-width: 40px; background: #101318cc; }
    aside.tools { width: 200px; background: var(--panel); border-left: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
    .tools .row { display: flex; gap: 6px; } .tools .row button { flex: 1; }
    .note { width: 100%; min-height: 72px; background: #101318; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; resize: vertical; }
    .hint { color: var(--muted); font-size: 12px; } .mark-info { font-size: 12px; color: var(--muted); min-height: 2.8em; }
    @media (max-width: 900px) {
      main { flex-direction: column; }
      .palette { width: 100%; flex-direction: row; flex-wrap: wrap; max-height: 120px; border-right: 0; border-bottom: 1px solid var(--line); }
      .palette button { width: auto; }
      aside.tools { width: 100%; border-left: 0; border-top: 1px solid var(--line); max-height: 180px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">BodyChart<span>Physiotherapy charting</span></div>
    <input id="when" class="wide" type="datetime-local" title="Session date and time" />
    <input id="pname" placeholder="Name (optional)" />
    <input id="pid" placeholder="ID (optional)" />
    <div class="grow"></div>
    <button type="button" id="btnNew">New</button>
    <button type="button" id="btnOpen">Open</button>
    <button type="button" id="btnSave">Save</button>
    <button type="button" class="primary" id="btnPng">Export PNG</button>
  </header>
  <main>
    <nav class="palette" id="palette"></nav>
    <div class="stage-wrap" id="stageWrap">
      <svg id="stage" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg">
        <rect class="bg-screen" x="0" y="0" width="1400" height="820" fill="#0b0d10"/>
        <g id="world"><g id="figures"></g><g id="marks"></g></g>
      </svg>
      <div class="hud">
        <button type="button" id="zoomOut">-</button>
        <button type="button" id="zoomFit">Fit</button>
        <button type="button" id="zoomIn">+</button>
      </div>
    </div>
    <aside class="tools">
      <h2>Tools</h2>
      <div class="row"><button type="button" id="modeDraw">Draw</button><button type="button" id="modePan">Pan</button></div>
      <div class="row"><button type="button" id="btnUndo">Undo</button><button type="button" id="btnDelete">Delete mark</button></div>
      <h2>Selected mark</h2>
      <div class="mark-info" id="markInfo">Tap a symbol to select. Tap empty figure to place.</div>
      <label class="hint" for="note">Callout note (optional)</label>
      <textarea class="note" id="note" placeholder="Region, intensity, behaviour"></textarea>
      <p class="hint">V1 symbols only. No area shading. Export PNG is white background + black figures.</p>
    </aside>
  </main>
</div>
<input id="fileOpen" type="file" accept="application/json,.json" hidden />
<script src="app.js"></script>
<script src="figures.js"></script>
<script src="chart.js"></script>
</body>
</html>
